<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>PastezBin</title>
  <link rel="icon" href="/static/favicon.ico">

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      background: #1f1d2e;
      font-family: monospace;
      display: flex;
      flex-direction: column;
    }

    #topbar {
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #313244;
      font-size: 13px;
      height: 44px;
      position: relative;
    }

    #brand {
      position: absolute;
      left: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #brand img {
      width: 20px;
      height: 20px;
    }

    #brand .title {
      color: #cdd6f4;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    #actions {
      position: absolute;
      right: 12px;
      display: flex;
      align-items: center;
    }

    #copyLink {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 6px;
      color: #cdd6f4;
      opacity: 0.85;
      transition: background 0.2s ease, opacity 0.2s ease;
    }

    #copyLink:hover {
      background: rgba(255, 255, 255, 0.08);
      opacity: 1;
    }

    #copyLink img {
      width: 16px;
      height: 16px;
    }

    #tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .tab {
      padding: 6px 14px;
      cursor: pointer;
      color: #6c7086;
    }

    .tab.active {
      color: #cdd6f4;
      border-bottom: 2px solid #89b4fa;
    }

    #content {
      flex: 1;
      display: flex;
    }

    textarea {
      flex: 1;
      width: 100%;
      padding: 20px;
      border: none;
      outline: none;
      resize: none;
      box-sizing: border-box;
      font-size: 14px;
      background: transparent;
      color: #cdd6f4;
      overflow: auto;
    }

    .hidden {
      display: none;
    }

    #imageView {
      flex: 1;
      padding: 20px;
      overflow: auto;
    }

    #imageView:not(.hidden) {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #imageView:empty::before {
      content: "Paste an image here (Ctrl+V)";
      display: flex;
      height: 100%;
      align-items: center;
      justify-content: center;
      color: #6c7086;
      opacity: 0.6;
      font-size: 14px;
    }

    #imageView.hasImages {
      justify-content: flex-start;
    }

    #imageView.hasImages:empty::before {
      display: none;
    }

    .imageWrapper {
      position: relative;
      display: inline-block;
      margin-bottom: 14px;
    }

    .imageWrapper img {
      max-width: 100%;
      display: block;
    }

    .imageControls {
      position: absolute;
      top: 6px;
      right: 6px;
      display: flex;
      gap: 8px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .imageWrapper:hover .imageControls {
      opacity: 1;
    }

    .imgIcon {
      width: 20px;
      height: 20px;
      padding: 6px;
      background: rgba(0, 0, 0, 0.65);
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .imgIcon:hover {
      background: rgba(0, 0, 0, 0.9);
    }

    #dropZone {
      width: 100%;
      max-width: 500px;
      min-height: 180px;
      height: auto;
      border: 2px dashed #45475a;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease;
      flex-shrink: 0;
    }

    #dropZone:hover,
    #dropZone.dragOver {
      border-color: #89b4fa;
      background: rgba(137, 180, 250, 0.05);
    }

    #dropZone.hidden {
      display: none;
    }

    #dropZone svg {
      width: 48px;
      height: 48px;
      stroke: #6c7086;
    }

    #dropZone p {
      margin: 0;
      color: #6c7086;
      font-size: 14px;
    }

    #dropZone .uploadBtn {
      margin-top: 4px;
      padding: 8px 16px;
      background: rgba(137, 180, 250, 0.15);
      color: #89b4fa;
      border-radius: 6px;
      font-size: 13px;
    }

    #imagesContainer {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      padding-bottom: 14px;
    }

    .imageWrapper {
      position: relative;
      display: inline-block;
    }

    .imageWrapper img {
      max-width: 100%;
      display: block;
    }
  </style>
</head>

<body>

  <div id="topbar">
    <div id="brand">
      <img src="/static/favicon.ico" alt="favicon">
      <div class="title">PastezBin</div>
    </div>

    <div id="tabs">
      <div class="tab active" data-mode="text">text</div>
      <div class="tab" data-mode="image">image</div>
    </div>

    <div id="actions">
      <div id="copyLink">
        <img src="/static/copy.svg" alt="copy icon">
        <span id="copyText">Copy Link</span>
      </div>
    </div>
  </div>

  <div id="content">
    <textarea id="editor" placeholder="Start typing..."></textarea>
    <div id="imageView" class="hidden">
      <div id="imagesContainer"></div>
      <div id="dropZone">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <p>Drag and drop an image here, or click to browse</p>
        <div class="uploadBtn">Select from folder</div>
        <input type="file" id="fileInput" accept="image/*" style="display: none">
      </div>
    </div>
  </div>

  <script src="static/pako.min.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const editor = document.getElementById("editor");
      const imageView = document.getElementById("imageView");
      const tabs = document.querySelectorAll(".tab");
      const copyBtn = document.getElementById("copyLink");
      const copyText = document.getElementById("copyText");
      const dropZone = document.getElementById("dropZone");
      const fileInput = document.getElementById("fileInput");
      const imagesContainer = document.getElementById("imagesContainer");

      let mode = "text";
      let images = [];
      let lastHash = "";

      /* Copy Link */
      copyBtn.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(window.location.href);
          copyText.textContent = "Copied!";
          setTimeout(() => {
            copyText.textContent = "Copy Link";
          }, 1200);
        } catch (err) {
          console.error("Copy failed:", err);
        }
      });

      /* -------- Tab Switch -------- */
      function switchMode(newMode) {
        mode = newMode;

        tabs.forEach(t =>
          t.classList.toggle("active", t.dataset.mode === newMode)
        );

        editor.classList.toggle("hidden", newMode !== "text");
        imageView.classList.toggle("hidden", newMode !== "image");
        saveToURL();
      }

      tabs.forEach(tab => {
        tab.addEventListener("click", () => {
          switchMode(tab.dataset.mode);
        });
      });

      /* -------- Base64URL helpers -------- */
      function uint8ToBase64Url(uint8) {
        const binary = String.fromCharCode(...uint8);
        return btoa(binary)
          .replace(/\+/g, '-')
          .replace(/\//g, '_')
          .replace(/=+$/, '');
      }

      function base64UrlToUint8(base64url) {
        let base64 = base64url.replace(/-/g, '+').replace(/_/g, '/');
        while (base64.length % 4) base64 += '=';
        let binary = atob(base64);
        let bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        return bytes;
      }

      function renderImages(src, index) {

        const wrapper = document.createElement("div");
        wrapper.className = "imageWrapper";

        const img = document.createElement("img");
        img.src = src;

        const controls = document.createElement("div");
        controls.className = "imageControls";

        const downloadIcon = document.createElement("img");
        downloadIcon.src = "/static/download.svg";
        downloadIcon.className = "imgIcon";
        downloadIcon.alt = "download";

        downloadIcon.addEventListener("click", async () => {
          const image = new Image();
          image.src = src;
          await image.decode();

          const canvas = document.createElement("canvas");
          canvas.width = image.width;
          canvas.height = image.height;
          canvas.getContext("2d").drawImage(image, 0, 0);

          const link = document.createElement("a");
          link.download = "image.png";
          link.href = canvas.toDataURL("image/png");
          link.click();
        });

        const deleteIcon = document.createElement("img");
        deleteIcon.src = "/static/trash.svg";
        deleteIcon.className = "imgIcon";
        deleteIcon.alt = "delete";

        deleteIcon.addEventListener("click", () => {
          const currentIndex = images.indexOf(src);
          if (currentIndex !== -1) {
            images.splice(currentIndex, 1);
          }
          wrapper.remove();
          saveToURL();
          updateDropZoneVisibility();
        });

        controls.appendChild(downloadIcon);
        controls.appendChild(deleteIcon);

        wrapper.appendChild(img);
        wrapper.appendChild(controls);
        imagesContainer.appendChild(wrapper);
        updateDropZoneVisibility();
      }

      function updateDropZoneVisibility() {
        if (images.length > 0) {
          imageView.classList.add("hasImages");
        } else {
          imageView.classList.remove("hasImages");
        }
      }

      /* -------- Save -------- */
      function saveToURL() {
        const encoder = new TextEncoder();
        let rawString = "";
        let newHash = "";

        if (mode === "text") {
          rawString = editor.value;
          const compressed = pako.deflateRaw(encoder.encode(rawString));
          newHash = '#t:' + uint8ToBase64Url(compressed);
        }

        if (mode === "image") {
          rawString = JSON.stringify(images);
          const compressed = pako.deflateRaw(encoder.encode(rawString));
          newHash = '#i:' + uint8ToBase64Url(compressed);
        }

        if (newHash !== lastHash) {
          history.replaceState(null, null, newHash);
          lastHash = newHash;
        }

        const rawBytes = encoder.encode(rawString).length;
        const finalURLLength = (newHash).length;

        console.log("Raw bytes:", rawBytes);
        console.log("Final URL length:", finalURLLength);
      }

      /* -------- Load -------- */
      function loadFromURL() {
        if (location.hash.length <= 1) return;

        try {
          const raw = location.hash.substring(1);
          const type = raw.substring(0, 2);
          const encoded = raw.substring(2);

          const decompressed = pako.inflateRaw(
            base64UrlToUint8(encoded)
          );

          const decoded = new TextDecoder().decode(decompressed);

          if (type === "t:") {
            editor.value = decoded;
            switchMode("text");
          }

          if (type === "i:") {
            images = JSON.parse(decoded);
            switchMode("image");
            images.forEach((src, i) => renderImages(src, i));
          }

        } catch (e) {
          console.error("Load failed:", e);
        }
      }

      /* -------- Image Paste -------- */
      document.addEventListener("paste", async (e) => {
        if (mode !== "image") return;

        for (let item of e.clipboardData.items) {
          if (item.type.startsWith("image/")) {
            e.preventDefault();
            const file = item.getAsFile();
            await processImageFile(file);
            return;
          }
        }
      });

      loadFromURL();
      updateDropZoneVisibility();

      /* -------- Drop Zone -------- */
      dropZone.addEventListener("click", () => {
        fileInput.click();
      });

      fileInput.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (file && file.type.startsWith("image/")) {
          processImageFile(file);
        }
        fileInput.value = "";
      });

      dropZone.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropZone.classList.add("dragOver");
      });

      dropZone.addEventListener("dragleave", (e) => {
        e.preventDefault();
        dropZone.classList.remove("dragOver");
      });

      dropZone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropZone.classList.remove("dragOver");
        const file = e.dataTransfer.files[0];
        if (file && file.type.startsWith("image/")) {
          processImageFile(file);
        }
      });

      async function processImageFile(file) {
        const bitmap = await createImageBitmap(file);

        const maxWidth = 1200;
        const scale = Math.min(1, maxWidth / bitmap.width);

        const canvas = document.createElement("canvas");
        canvas.width = bitmap.width * scale;
        canvas.height = bitmap.height * scale;

        canvas.getContext("2d")
          .drawImage(bitmap, 0, 0, canvas.width, canvas.height);

        bitmap.close();

        canvas.toBlob(blob => {
          const reader = new FileReader();
          reader.onload = function () {
            images.push(reader.result);
            renderImages(reader.result, images.length - 1);
            saveToURL();
          };
          reader.readAsDataURL(blob);
        }, "image/webp", 0.75);
      }

      /* -------- Auto Save -------- */
      let timeout;
      editor.addEventListener('input', () => {
        clearTimeout(timeout);
        timeout = setTimeout(saveToURL, 500);
      });

    });
  </script>

</body>

</html>
